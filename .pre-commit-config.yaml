repos:
  # ── Ruff (lint + format) ────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Mypy (type checking) ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^backend/hermeshq/
        pass_filenames: false
        args:
          - --config-file=backend/pyproject.toml
          - --follow-imports=silent
          - backend/hermeshq/models
          - backend/hermeshq/schemas
          - backend/hermeshq/core/events.py
          - backend/hermeshq/config.py
          - backend/hermeshq/services/agent_supervisor.py
          - backend/hermeshq/services/runtime_base.py
          - backend/hermeshq/routers/tasks.py
        additional_dependencies:
          - fastapi>=0.115
          - pydantic-settings>=2.2
          - sqlalchemy>=2.0

  # ── ESLint (frontend) ───────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ── Validaciones genéricas ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
