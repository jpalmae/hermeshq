version: 2

updates:
  # Backend Python deps
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: pypdf
        versions: ["7.x"]
      - dependency-name: croniter
        versions: ["7.x"]

  # Frontend npm deps
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: msw
        versions: ["3.x"]
      - dependency-name: eslint
        versions: ["10.x"]
      - dependency-name: vite
        versions: ["8.x"]
      - dependency-name: "@vitejs/plugin-react"
        versions: ["6.x"]
      - dependency-name: jsdom
        versions: ["31.x"]

  # WhatsApp bridge npm deps
  - package-ecosystem: npm
    directory: /backend/hermeshq/assets/whatsapp-bridge
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: express
        versions: ["5.x"]
      - dependency-name: pino
        versions: ["10.x"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
