services:
  postgres:
    image: postgres:16
    container_name: hermeshq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hermeshq}
      POSTGRES_USER: ${POSTGRES_USER:-hermeshq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermeshq}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermeshq} -d ${POSTGRES_DB:-hermeshq}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hermeshq_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - internal

  backend:
    image: ${RUNTIME_IMAGE:-hermeshq-runtime:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hermeshq-backend
    depends_on:
      postgres:
        condition: service_healthy
      runtime-runner:
        condition: service_healthy
      runtime-egress:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hermeshq:hermeshq@postgres:5432/hermeshq}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set in .env}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-3600}
      TASK_QUEUE_POLL_SECONDS: ${TASK_QUEUE_POLL_SECONDS:-1}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-45}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-10}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      AGENT_SERVICE_TOKEN_DAYS: ${AGENT_SERVICE_TOKEN_DAYS:-30}
      RUNTIME_ISOLATION_MODE: required
      RUNTIME_RUNNER_URL: http://runtime-runner:8080
      RUNTIME_RUNNER_TOKEN: ${RUNTIME_RUNNER_TOKEN:?RUNTIME_RUNNER_TOKEN must be set in .env}
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC Provider}
      OIDC_PROVIDER_SLUG: ${OIDC_PROVIDER_SLUG:-generic}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      OIDC_AUTO_PROVISION_USERS: ${OIDC_AUTO_PROVISION_USERS:-false}
      OIDC_VISIBLE_PROVIDERS: ${OIDC_VISIBLE_PROVIDERS:-}
      OIDC_PROVIDER_LOGIN_URL_GOOGLE: ${OIDC_PROVIDER_LOGIN_URL_GOOGLE:-}
      OIDC_PROVIDER_LOGIN_URL_MICROSOFT: ${OIDC_PROVIDER_LOGIN_URL_MICROSOFT:-}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Hermes Operator}
      WORKSPACES_ROOT: ${WORKSPACES_ROOT:-/app/workspaces}
      BRANDING_ROOT: ${BRANDING_ROOT:-/app/workspaces/_branding}
      PTY_SHELL: ${PTY_SHELL:-/bin/sh}
      CORS_ORIGINS: '${CORS_ORIGINS_JSON:-["http://localhost:3420","http://frontend"]}'
      CONCURRENCY_SEMAPHORE: ${CONCURRENCY_SEMAPHORE:-8}
      HQ_BOOTSTRAP_TIMEOUT: ${HQ_BOOTSTRAP_TIMEOUT:-30}
      HQ_BOOTSTRAP_RETRIES: ${HQ_BOOTSTRAP_RETRIES:-2}
    volumes:
      - hermeshq_workspaces:/app/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.8"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - default
      - runtime-control

  runtime-runner:
    image: ${RUNTIME_IMAGE:-hermeshq-runtime:local}
    pull_policy: never
    container_name: hermeshq-runtime-runner
    user: "0:0"
    command: ["uvicorn", "hermeshq.runtime_runner:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      RUNTIME_RUNNER_TOKEN: ${RUNTIME_RUNNER_TOKEN:?RUNTIME_RUNNER_TOKEN must be set in .env}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE:-hermeshq-runtime:local}
      RUNTIME_BACKEND_CONTAINER: hermeshq-backend
      RUNTIME_EGRESS_CONTAINER: hermeshq-runtime-egress
      RUNTIME_INTERNAL_API_URL: http://backend:8000/api/internal
      RUNTIME_EGRESS_PROXY_URL: http://runtime-egress:3128
      RUNTIME_CONTAINER_MEMORY: ${RUNTIME_CONTAINER_MEMORY:-768m}
      RUNTIME_CONTAINER_CPUS: ${RUNTIME_CONTAINER_CPUS:-1.0}
      RUNTIME_CONTAINER_PIDS: ${RUNTIME_CONTAINER_PIDS:-256}
      RUNTIME_MAX_SECONDS: ${TASK_TIMEOUT_SECONDS:-3600}
      RUNTIME_RUNNER_MAX_CONCURRENCY: ${CONCURRENCY_SEMAPHORE:-8}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Runtime-Runner-Token: ${RUNTIME_RUNNER_TOKEN}",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - runtime-control

  runtime-egress:
    build:
      context: .
      dockerfile: backend/runtime-egress/Dockerfile
    container_name: hermeshq-runtime-egress
    environment:
      RUNTIME_EGRESS_ALLOWLIST: ${RUNTIME_EGRESS_ALLOWLIST:-.api.openai.com,.api.anthropic.com,.openrouter.ai,.integrate.api.nvidia.com,.inference-api.nousresearch.com,.api.kimi.com,.api.moonshot.ai,.api.z.ai,.generativelanguage.googleapis.com,.chatgpt.com,.api.telegram.org,bedrock-runtime.us-east-1.amazonaws.com}
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/squid.pid && kill -0 $$(cat /tmp/squid.pid)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=13,gid=13,mode=0770
      - /run:rw,noexec,nosuid,nodev,size=4m,uid=13,gid=13,mode=0770
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,uid=13,gid=13,mode=0770
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=16m,uid=13,gid=13,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: hermeshq-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3420}:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

volumes:
  hermeshq_postgres:
  hermeshq_workspaces:

networks:
  internal:
    internal: true
  runtime-control:
    name: hermeshq_runtime_control
    internal: true
  default:
